name: Centauri Control

on:
  push:
  workflow_dispatch:

# write is needed only to publish a release when a v* tag is pushed
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # A fixed signing key lets a new APK install over the old one without
      # losing settings. Optional: without the secret, each build is signed
      # with a throwaway key and must be installed fresh.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: centauri-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: centauri-control-web
          path: dist

      # Pushing a tag like v0.2.0 publishes a GitHub release with ready-to-use downloads.
      - name: Package release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p release pkg/printer pkg/web
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/CentauriControl-${V}.apk"
          cp -r dist pkg/printer/www
          cp tools/printer_install.py pkg/printer/install_on_printer.py
          cp docs/release/printer-README.txt pkg/printer/README.txt
          (cd pkg/printer && zip -qr "../../release/CentauriControl-${V}-printer.zip" .)
          cp -r dist/. pkg/web/
          (cd pkg/web && zip -qr "../../release/CentauriControl-${V}-web.zip" .)
          ls -la release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Centauri Control $GITHUB_REF_NAME" --notes-file docs/release/notes.md
