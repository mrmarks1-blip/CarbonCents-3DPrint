name: Centauri Control

on:
  push:
  workflow_dispatch:
  # A release published from the GitHub website or app (which creates the tag)
  # builds and attaches the downloads too.
  release:
    types: [published]

# write is needed only to publish releases (and create their tags)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # A fixed signing key lets a new APK install over the old one without
      # losing settings. Optional: without the secret, each build is signed
      # with a throwaway key and must be installed fresh.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Gradle may sign with its own generated key, so re-sign with the fixed one when it is set.
      - name: Sign with the fixed key and show the certificate
        run: |
          A=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$HOME/.android/debug.keystore" ]; then
            "$A" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$APK"
          fi
          "$A" verify --print-certs "$APK" | grep -i 'certificate SHA-256'
      - uses: actions/upload-artifact@v4
        with:
          name: centauri-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: centauri-control-web
          path: dist

      # Releases. Any of these publishes one with ready-to-use downloads:
      # - a push to main whose package.json version has no release yet (the tag
      #   vX.Y.Z is created here, so nobody has to push tags),
      # - pushing a tag like v0.2.0,
      # - publishing a release on the GitHub website.
      - name: Decide whether to release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            CANDIDATE="v$(node -p "require('./package.json').version")"
            if ! gh release view "$CANDIDATE" >/dev/null 2>&1; then V="$CANDIDATE"; fi
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Release: ${V:-none}"
      - name: Package release files
        if: steps.rel.outputs.v != ''
        run: |
          V="${{ steps.rel.outputs.v }}"
          mkdir -p release pkg/printer pkg/web
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/CentauriControl-${V}.apk"
          cp -r dist pkg/printer/www
          cp tools/printer_install.py pkg/printer/install_on_printer.py
          cp tools/bedmesh.py tools/rsh.py pkg/printer/
          cp docs/release/printer-README.txt pkg/printer/README.txt
          (cd pkg/printer && zip -qr "../../release/CentauriControl-${V}-printer.zip" .)
          cp -r dist/. pkg/web/
          (cd pkg/web && zip -qr "../../release/CentauriControl-${V}-web.zip" .)
          ls -la release
      - name: Publish release
        if: steps.rel.outputs.v != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.rel.outputs.v }}
        # Create the release (and its tag, at this commit), or fill in one made on the website.
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" release/* --clobber
            gh release edit "$V" --title "Centauri Control $V" --notes-file docs/release/notes.md
          else
            gh release create "$V" release/* --target "$GITHUB_SHA" --title "Centauri Control $V" --notes-file docs/release/notes.md
          fi
